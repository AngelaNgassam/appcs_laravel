name: CI-CD Scolaire_app

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

env:
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: cartes_scolaires
  DB_USERNAME: root
  DB_PASSWORD: ""

jobs:
  # --- STAGE 1 : QUALITÉ & LINTING (Backend) ---
  lint-backend:
    name: "✨ Linting & Style (Backend)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "⚙️ Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      
      - name: "📥 Install Deps"
        working-directory: ./Backend
        run: composer install --no-interaction --prefer-dist
      
      - name: "🧐 Laravel Pint (Check)"
        working-directory: ./Backend
        run: ./vendor/bin/pint --test
        continue-on-error: true

  # --- STAGE 2 : TESTS & SONARCLOUD (Backend) ---
  tests-backend:
    name: "🛡️ Tests & Sonar (Backend)"
    needs: lint-backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cartes_scolaires
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "⚙️ Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, mysql, bcmath
          coverage: xdebug

      - name: "🔍 Debug: Check Backend Path"
        run: |
          pwd
          ls -R Backend | head -n 20

      - name: "🧪 Run Migrations & Tests"
        working-directory: ./Backend
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan test
        env:
          DB_PASSWORD: "" 

      - name: "🛡️ Scan SonarCloud"
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=AngelaNgassam_appcs_laravel
            -Dsonar.organization=angelangassam
            -Dsonar.sources=Backend/app
            -Dsonar.tests=Backend/tests

  # --- STAGE 3 : BUILD FRONTEND (Angular) ---
  frontend-build:
    name: "🌐 Build Frontend (Angular)"
    needs: tests-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: "🔍 Debug: Verify Frontend Path"
        run: |
          echo "📍 Current Directory: $(pwd)"
          echo "📂 Listing Root Files:"
          ls -F
          echo "📂 Checking for package-lock.json in Frontend:"
          if [ -f "Frontend/package-lock.json" ]; then
            echo "✅ package-lock.json found!"
          else
            echo "❌ package-lock.json NOT found at Frontend/package-lock.json"
            ls -R Frontend
          fi

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: "🏗️ Build Production"
        working-directory: ./Frontend
        run: |
          npm ci
          npm run build -- --configuration=production

      - name: "📤 Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/
          retention-days: 1

  # --- STAGE 4 : DOCKER HUB ---
  docker-hub:
    name: "🐳 Docker Build & Push"
    needs: tests-backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "🔑 Login Docker"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: "🚀 Push Image"
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/exchapay-backend:latest

  # --- STAGE 5 : DÉPLOIEMENT O2SWITCH (FTP) ---
  deploy-o2switch:
    name: "🚀 Deploy to o2switch"
    needs: [frontend-build, tests-backend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "📥 Download Frontend Build"
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist-frontend

      - name: "🔍 Debug: Check Downloaded Artifact"
        run: ls -R ./dist-frontend

      - name: "🚀 FTP Deploy Backend"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./Backend/
          server-dir: Backend_Code/
          exclude: |
            **/vendor/**
            **/.env
            **/.git*
            **/tests/**

      - name: "🚀 FTP Deploy Frontend"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist-frontend/
          server-dir: Frontend_Public/

      - name: "✅ Success Logs"
        run: |
          echo "🚀 Déploiement terminé avec succès sur o2switch !"
          echo "🔗 URL : https://ngassam.cdwfs.net"