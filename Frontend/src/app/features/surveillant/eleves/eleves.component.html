<div class="bg-light min-vh-100 py-4">
  <div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h3 class="fw-bold mb-0">
          <i class="bi bi-people-fill me-2 text-success"></i>
          Élèves
        </h3>
        <div class="text-muted small">Consultation des élèves (établissement)</div>
      </div>
      <button class="btn btn-outline-success" (click)="load()">
        <i class="bi bi-arrow-clockwise me-2"></i>
        Actualiser
      </button>
    </div>

    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-8">
            <label class="form-label">Recherche</label>
            <input class="form-control" [(ngModel)]="search" placeholder="Nom, prénom, matricule" (keyup.enter)="onSearch()" />
          </div>
          <div class="col-md-2">
            <label class="form-label">Archivés</label>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" [(ngModel)]="showArchived" (change)="onSearch()" />
              <label class="form-check-label">Afficher</label>
            </div>
          </div>
          <div class="col-md-2 text-end">
            <button class="btn btn-success w-100" (click)="onSearch()">
              <i class="bi bi-search me-2"></i>
              Rechercher
            </button>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-success" role="status"></div>
    </div>

    <div *ngIf="error && !loading" class="alert alert-danger">
      {{ error }}
    </div>

    <div *ngIf="!loading && !error" class="card border-0 shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="bg-light">
          <tr>
            <th>Matricule</th>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Classe</th>
            <th>Photo</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let e of eleves">
            <td class="fw-semibold">{{ e?.matricule }}</td>
            <td>{{ e?.nom }}</td>
            <td>{{ e?.prenom }}</td>
            <td>{{ e?.classe?.nom || '-' }}</td>
            <td>
              <span class="badge" [ngClass]="getPhotoStatutBadge(e)">
                {{ getPhotoStatutLabel(e) }}
              </span>
            </td>
          </tr>
          <tr *ngIf="eleves.length === 0">
            <td colspan="5" class="text-center py-5 text-muted">Aucun élève</td>
          </tr>
          </tbody>
        </table>
      </div>

      <div class="card-body d-flex justify-content-between align-items-center" *ngIf="totalPages > 1">
        <div class="text-muted small">Total: {{ total }}</div>
        <div>
          <button class="btn btn-outline-secondary btn-sm me-2" [disabled]="currentPage<=1" (click)="goToPage(currentPage-1)">Précédent</button>
          <span class="small">Page {{ currentPage }} / {{ totalPages }}</span>
          <button class="btn btn-outline-secondary btn-sm ms-2" [disabled]="currentPage>=totalPages" (click)="goToPage(currentPage+1)">Suivant</button>
        </div>
      </div>
    </div>

  </div>
</div>
